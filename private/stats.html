<h1 style="font-family:system-ui; font-weight:600;">Console interne — Stats</h1>
<p style="opacity:0.7;">Lecture du Worker Cloudflare + analyse locale.</p>

<section>
  <h2>1. Stats brutes</h2>
  <pre id="raw">Chargement…</pre>
</section>

<section>
  <h2>2. Articles résolus</h2>
  <div id="resolved"></div>
</section>

<section>
  <h2>3. Slugs non résolus</h2>
  <pre id="unresolved"></pre>
</section>

<section>
  <h2>4. Capsules générées (aperçu)</h2>
  <div id="capsules" style="display:flex; flex-direction:column; gap:1rem;"></div>
</section>

<script>
async function getArticles() {
  return fetch("/articles.json").then(r => r.json());
}

function extractPureSlug(cloudSlug) {
  const sections = ["idees","spiritualite","creations","actualites","passe"];
  for (const s of sections) {
    if (cloudSlug.startsWith(s)) {
      return cloudSlug.replace(s, "").replace(/^\-/, "").replace(/^\//, "");
    }
  }
  return cloudSlug;
}

async function load() {
  const stats = await fetch("https://proud-snowflake-0d5a.lapinsights.workers.dev/stats").then(r => r.json());
  const articles = await getArticles();

  // 1. Stats brutes
  document.getElementById("raw").textContent = JSON.stringify(stats, null, 2);

  const resolved = [];
  const unresolved = [];
  const capsules = document.getElementById("capsules");

  for (const item of stats) {
    const cloudSlug = item.name;
    if (!cloudSlug || cloudSlug.startsWith("test") || cloudSlug.includes("stats")) continue;

    const pureSlug = extractPureSlug(cloudSlug);
    const article = articles.find(a => a.slug === pureSlug);

    if (article) {
      resolved.push({ cloudSlug, pureSlug, article });

      // Capsule preview
      const div = document.createElement("div");
      div.style.padding = "1rem";
      div.style.border = "1px solid #ddd";
      div.style.borderRadius = "6px";
      div.style.background = "#fafafa";

      div.innerHTML = `
        <strong>${article.title}</strong><br>
        <small>${article.resume || ""}</small><br>
        <a href="${article.url}" target="_blank">ouvrir</a>
      `;
      capsules.appendChild(div);

    } else {
      unresolved.push({ cloudSlug, pureSlug });
    }
  }

  // 2. Résolus
  document.getElementById("resolved").innerHTML =
    resolved.map(r => `<p><strong>${r.cloudSlug}</strong> → ${r.article.title}</p>`).join("");

  // 3. Non résolus
  document.getElementById("unresolved").textContent =
    JSON.stringify(unresolved, null, 2);
}

load();
</script>
