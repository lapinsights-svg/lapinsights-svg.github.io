<!-- LikeBtn — version minérale Lapinsights -->
<span class="likebtn-wrapper"
      data-theme="custom"
      data-icon_like="👍"
      data-icon_dislike=""
      data-counter_type="number"
      data-counter_clickable="true"
      data-identifier="{{ page.url }}">
</span>

<style>
/* Style minéral, sobre, vertical */
.likebtn-wrapper {
  font-size: 20px;          /* taille du pouce */
  filter: grayscale(100%);  /* enlève toute couleur */
  opacity: 0.55;            /* discrétion */
  transition: opacity 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;                 /* espace entre pouce et compteur */
}

.likebtn-wrapper:hover {
  opacity: 0.9;             /* léger réveil au survol */
}

/* Supprime les couleurs et animations par défaut de LikeBtn */
.likebtn-icon {
  filter: grayscale(100%) !important;
}

.likebtn-counter {
  font-size: 15px;
  color: #444;              /* gris minéral */
  font-weight: 400;
}
</style>

<script>
(function(d,e,s){
  if(d.getElementById("likebtn_wjs")) return;
  var a=d.createElement(e);
  var m=d.getElementsByTagName(e)[0];
  a.async=1;
  a.id="likebtn_wjs";
  a.src=s;
  m.parentNode.insertBefore(a, m)
})(document,"script","//w.likebtn.com/js/w/widget.js");
</script>
