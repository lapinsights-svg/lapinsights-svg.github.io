<h1 class="essentiels-title">Les textes qui résonnent</h1>
<p class="essentiels-subtitle">Cette liste évolue selon les textes que vous lisez le plus.</p>

<div id="stats" class="capsules-list"></div>

<style>
/* TITRE — pulsation + onde circulaire + centrage parfait */
.essentiels-title {
  font-size: 2rem;
  margin: 0 auto 0.2rem auto;
  display: block;
  width: fit-content;

  letter-spacing: -0.6px;
  text-align: center;
  font-weight: 500;
  color: #1a1a1a;
  text-shadow: 0 0 6px rgba(200, 191, 176, 0.25);

  padding: 0.6rem 1.4rem;
  border-radius: 16px;

  animation: fremissement 9s ease-out, onde 9s ease-out;
}

.essentiels-title::after {
  content: "";
  display: block;
  width: 48px;
  height: 2px;
  background: linear-gradient(to right, transparent, #c8bfb0, transparent);
  margin: 0.7rem auto 0 auto;
  opacity: 0.8;
}

/* SOUS-TITRE — plus éthéré */
.essentiels-subtitle {
  text-align: center;
  font-size: 0.9rem;
  color: #666;
  margin-bottom: 1.8rem;
  opacity: 0.75;
  font-weight: 300;
  letter-spacing: 0.2px;
}

/* CONTENEUR */
.capsules-list {
  max-width: 500px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* CAPSULE — version mystique */
.capsule-item {
  padding: 0.75rem 1rem;
  border-left: 2px solid #c8bfb0;
  background: rgba(150,140,130,0.35);
  backdrop-filter: blur(4px);
  border-radius: 6px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  position: relative;
  overflow: hidden;
  transition: 0.35s ease;
}

/* Halo lumineux vertical */
.capsule-item::before {
  content: "";
  position: absolute;
  left: -40px;
  top: 0;
  width: 80px;
  height: 100%;
  background: radial-gradient(circle at left, rgba(180,150,100,0.35), transparent 70%);
  opacity: 0.45;
  transition: 0.4s ease;
}

/* Effet de glissement mystique */
.capsule-item:hover {
  transform: translateX(6px);
  background: rgba(255,255,255,0.32);
  box-shadow: 0 6px 18px rgba(0,0,0,0.10);
}

.capsule-item:hover::before {
  left: -20px;
  opacity: 0.5;
}

/* TITRE — plus incantatoire */
.capsule-title {
  font-size: 1.12rem;
  font-weight: 500;
  margin: 0;
  line-height: 1.25;
  letter-spacing: -0.3px;
}

.capsule-title a {
  text-decoration: none;
  color: #1a1a1a;
}

/* RÉSUMÉ — murmure */
.capsule-summary {
  font-size: 0.86rem;
  color: #444;
  margin-top: 0.35rem;
  line-height: 1.35;
  font-weight: 300;
  opacity: 0.9;
}

/* Pulsation cardiaque mystique */
@keyframes fremissement {
  0%   { transform: scale(1); opacity: 1; }

  /* Premier battement (lub) */
  8%   { transform: scale(1.055); opacity: 0.96; }
  14%  { transform: scale(1.02); opacity: 1; }

  /* Deuxième battement (dub) */
  22%  { transform: scale(1.065); opacity: 0.95; }
  30%  { transform: scale(1.018); opacity: 1; }

  /* Respiration lente */
  45%  { transform: scale(1.028); opacity: 0.97; }
  60%  { transform: scale(1.012); opacity: 1; }

  /* Retour au calme, très lent */
  80%  { transform: scale(1.006); opacity: 0.99; }
  100% { transform: scale(1); opacity: 1; }
}

/* Onde de résonance circulaire */
@keyframes onde {
  0% {
    box-shadow: 0 0 0 0 rgba(200, 191, 176, 0.55);
  }
  40% {
    box-shadow: 0 0 22px 14px rgba(200, 191, 176, 0.35);
  }
  70% {
    box-shadow: 0 0 38px 26px rgba(200, 191, 176, 0.18);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(200, 191, 176, 0);
  }
}
</style>

<script>
async function getArticlesData() {
  return fetch("/articles.json").then(r => r.json());
}

function extractPureSlug(workerSlug) {
  // Le Worker enregistre : "actualites50-balles" ou "spiritualiteUCEMBIBLE"
  // On doit extraire : "50-balles" ou "UCEMBIBLE"
  // Les collections connues
  const collections = ["actualites", "idees", "spiritualite", "creations", "passe", "vibrations"];
  
  for (const coll of collections) {
    if (workerSlug.startsWith(coll)) {
      // Enlever la collection du début
      return workerSlug.substring(coll.length);
    }
  }
  
  return workerSlug;
}

async function loadStats() {
  const stats = await fetch("https://proud-snowflake-0d5a.lapinsights.workers.dev/stats")
    .then(r => r.json());

  const articles = await getArticlesData();
  const container = document.getElementById("stats");

  // Créer une map pour retrouver les articles par slug pure
  const articleMap = {};
  for (const article of articles) {
    articleMap[article.slug] = article;
  }

  // Afficher les stats (déjà triées par le Worker)
  for (const item of stats) {
    const workerSlug = item.slug || "";
    const count = item.count || 0;
    
    // Extraire le slug pur (sans la collection)
    const pureSlug = extractPureSlug(workerSlug);

    // Ignorer si vide
    if (!pureSlug) continue;

    // Chercher l'article
    const article = articleMap[pureSlug];
    if (!article) {
      console.log("Article non trouvé pour slug:", pureSlug, "(worker slug:", workerSlug, ")");
      continue;
    }

    // Créer la capsule
    const div = document.createElement("div");
    div.className = "capsule-item";

    div.innerHTML = `
      <h2 class="capsule-title"><a href="${article.url}">${article.title}</a></h2>
      ${article.resume ? `<p class="capsule-summary">${article.resume}</p>` : ""}
    `;

    container.appendChild(div);
  }
}

loadStats();
</script>
