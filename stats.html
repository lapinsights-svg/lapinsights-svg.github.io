<div id="stats" class="capsules-list"></div>

<style>
/* TITRE */
.essentiels-title {
  font-size: 1.9rem;
  margin-bottom: 0.2rem;
  letter-spacing: -0.4px;
  text-align: center;

  opacity: 0.85;
}

.capsules-list {
  max-width: 460px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}

/* CAPSULE ULTRA-FINE */
.capsule-item {
  padding: 0.6rem 0.9rem;
  border-left: 2px solid #c8bfb0;
  background: rgba(255,255,255,0.28);
  backdrop-filter: blur(2px);
  transition: 0.2s ease;
}

.capsule-item:hover {
  background: rgba(255,255,255,0.48);
}

/* TITRE */
.capsule-title {
  font-size: 1.05rem;
  font-weight: 500;
  margin: 0;
  line-height: 1.22;
}

  text-decoration: none;
  color: #222;

.capsule-summary {
  font-size: 0.82rem;

  margin-top: 0.25rem;
  line-height: 1.28;
}
</style>

<script>
/* Charger les données des articles (titre + resume + url) */
async function getArticlesData() {
  return fetch("/articles.json").then(r => r.json());
}

/* Conversion slug → URL (pour les stats Cloudflare) */
function slugToUrl(slug) {
  const sections = ["idees", "spiritualite", "creations", "actualites"];
  const section = sections.find(s => slug.startsWith(s));
  if (!section) return null;
  return "https://lapinsights-svg.github.io/" + section + "/" + slug.slice(section.length) + "/";
}

/* Fusion stats + données articles */
async function loadStats() {
  const stats = await fetch("https://proud-snowflake-0d5a.lapinsights.workers.dev/stats")
    .then(r => r.json());

  const articles = await getArticlesData();
  const container = document.getElementById("stats");

  for (const item of stats) {
    const slug = item.name;

    if (!slug || slug.startsWith("test") || slug.includes("stats")) continue;

    const article = articles.find(a => a.slug === slug);
    if (!article) continue;

    const div = document.createElement("div");
    div.className = "capsule-item";

    div.innerHTML = `
      <h2 class="capsule-title"><a href="${article.url}">${article.title}</a></h2>
      ${article.resume ? `<p class="capsule-summary">${article.resume}</p>` : ""}
    `;

    container.appendChild(div);
  }
}

loadStats();
</script>
