title: Statistiques des articles

<h1>Articles les plus lus</h1>
<ul id="stats"></ul>

<script>
async function getTitleFromUrl(url) {
  try {
    const html = await fetch(url).then(r => r.text());
    const match = html.match(/<title>(.*?)<\/title>/i);
    if (match) return match[1].replace(" | Lapinsights", "").trim();
  } catch (e) {
    console.warn("Impossible de lire le titre pour", url);
  }
  return url;
}

function slugToUrl(slug) {
  let path = slug;
  const sections = ["idees", "spiritualite", "creations", "actualites"];

  for (const section of sections) {
    if (path.startsWith(section)) {
      path = "/" + section + "/" + path.slice(section.length);
    }
  }

  if (!path.endsWith("/")) path += "/";

  return "https://lapinsights-svg.github.io" + path;
}

async function loadStats() {
  const listRes = await fetch("https://proud-snowflake-0d5a.lapinsights.workers.dev/stats");
  const list = await listRes.json();

  const container = document.getElementById("stats");

  for (const item of list) {
    const slug = item.name;

    // ignorer les clés de test et l'accueil
    if (slug === "test" || slug === "test`" || slug === "" || slug === "home") continue;

    const url = slugToUrl(slug);
    const title = await getTitleFromUrl(url);

    const li = document.createElement("li");
    li.innerHTML = `<a href="${url}" target="_blank">${title}</a>`;
    container.appendChild(li);
  }
}

loadStats();
</script>
