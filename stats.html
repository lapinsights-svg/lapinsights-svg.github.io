<h1 class="essentiels-title">Les textes qui vous ont trouvé</h1>
<p class="essentiels-subtitle">Cette liste évolue selon les textes que vous lisez le plus.</p>

<div id="stats" class="capsules-list"></div>

<style>
/* TITRE */
.essentiels-title {
  font-size: 1.9rem;
  margin-bottom: 0.2rem;
  letter-spacing: -0.4px;
  text-align: center;
}

/* SOUS-TITRE */
.essentiels-subtitle {
  text-align: center;
  font-size: 0.9rem;
  color: #555;
  margin-bottom: 1.4rem;
  opacity: 0.85;
}

/* CONTENEUR FIN */
.capsules-list {
  max-width: 460px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}

/* CAPSULE ULTRA-FINE */
.capsule-item {
  padding: 0.6rem 0.9rem;
  border-left: 2px solid #c8bfb0;
  background: rgba(255,255,255,0.28);
  backdrop-filter: blur(2px);
  transition: 0.2s ease;
}

.capsule-item:hover {
  background: rgba(255,255,255,0.48);
}

/* TITRE */
.capsule-title {
  font-size: 1.05rem;
  font-weight: 500;
  margin: 0;
  line-height: 1.22;
}

.capsule-title a {
  text-decoration: none;
  color: #222;
}

/* RÉSUMÉ */
.capsule-summary {
  font-size: 0.82rem;
  color: #666;
  margin-top: 0.25rem;
  line-height: 1.28;
}
</style>

<script>
/* Récupération du titre + résumé YAML */
async function getTitleAndSummary(url) {
  try {
    const html = await fetch(url).then(r => r.text());

    /* Titre */
    const titleMatch = html.match(/<title>(.*?)<\/title>/i);
    let title = titleMatch ? titleMatch[1].trim() : null;
    if (title) {
      title = title
        .replace(/[\|\-–—·]\s*Lapinsights/i, "")
        .replace(/Lapinsights/i, "")
        .trim();
    }

    /* Résumé YAML */
    const summaryMatch = html.match(/summary:\s*["']?(.*?)["']?\s*\n/i);
    const summary = summaryMatch ? summaryMatch[1].trim() : null;

    return { title, summary };
  } catch (e) {
    return { title: null, summary: null };
  }
}

/* Conversion slug → URL */
function slugToUrl(slug) {
  const sections = ["idees", "spiritualite", "creations", "actualites"];
  const section = sections.find(s => slug.startsWith(s));
  if (!section) return null;
  return "https://lapinsights-svg.github.io/" + section + "/" + slug.slice(section.length) + "/";
}

/* Chargement dynamique */
async function loadStats() {
  const list = await fetch("https://proud-snowflake-0d5a.lapinsights.workers.dev/stats")
    .then(r => r.json());

  const container = document.getElementById("stats");

  for (const item of list) {
    const slug = item.name;
    if (!slug || slug.startsWith("test") || slug.includes("stats")) continue;

    const url = slugToUrl(slug);
    if (!url) continue;

    const { title, summary } = await getTitleAndSummary(url);
    if (!title) continue;

    const div = document.createElement("div");
    div.className = "capsule-item";

    div.innerHTML = `
      <h2 class="capsule-title"><a href="${url}">${title}</a></h2>
      ${summary ? `<p class="capsule-summary">${summary}</p>` : ""}
    `;

    container.appendChild(div);
  }
}

loadStats();
</script>
