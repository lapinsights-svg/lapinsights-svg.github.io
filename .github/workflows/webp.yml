name: Manual WebP Conversion

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install WebP tools
        run: sudo apt-get install -y webp

      - name: Convert all PNG/JPG in /images and subfolders
        run: |
          shopt -s globstar
          for file in images/**/*.{png,jpg,jpeg}; do
            [ -e "$file" ] || continue
            output="${file%.*}.webp"
            cwebp -q 80 "$file" -o "$output"
          done

      - name: Commit WebP files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add images/**/*.webp
          git commit -m "Manual WebP conversion" || echo "No changes"
          git push
