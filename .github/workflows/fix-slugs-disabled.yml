name: Fix Slugs Automatically

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-slugs:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Ruby (no bundler)
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full

      - name: Run slug fixer
        run: |
          mkdir -p scripts
          cat << 'EOF' > scripts/fix_slugs.rb
          #!/usr/bin/env ruby
          require 'yaml'

          # Collections réelles de ton site
          collections = [
            "_actualites",
            "_creations",
            "_idees",
            "_passe",
            "_spiritualite",
            "_vibrations"
          ]

          collections.each do |folder|
            Dir["#{folder}/*.md"].each do |file|
              lines = File.read(file).split("\n")

              # Vérifier que le fichier commence par ---
              if lines[0].strip != "---"
                puts "⚠ Pas de front‑matter → #{file}"
                next
              end

              # Trouver la fin du front‑matter
              fm_end = lines[1..].index { |l| l.strip == "---" }
              if fm_end.nil?
                puts "⚠ Front‑matter mal formé → #{file}"
                next
              end

              fm_end += 1  # décalage car on a commencé à 1

              front_raw = lines[1...fm_end].join("\n")
              body      = lines[(fm_end+1)..].join("\n")

              front_matter = YAML.safe_load(front_raw) || {}

              if !front_matter.key?("slug") || front_matter["slug"].to_s.strip == ""
                slug = File.basename(file, ".md")
                front_matter["slug"] = slug

                puts "✔ Ajout slug '#{slug}' → #{file}"

                new_front = front_matter.to_yaml
                File.write(file, "---\n#{new_front}---\n#{body}")
              else
                puts "• OK (slug présent) → #{file}"
              end
            end
          end
          EOF

          ruby scripts/fix_slugs.rb

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git commit -m "Auto-fix slugs" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
