name: Fix Image Paths Automatically

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-image-paths:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Ruby
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full

      - name: Run image path fixer
        run: |
          ruby -e '
            files = Dir["**/*.{md,css,html,liquid,xml,json,js}"]
            files.each do |file|
              content = File.read(file)
              new_content = content.gsub(%r{(?<!statics)\/images\/}, "/statics/images/")
              if new_content != content
                puts "✔ Chemins corrigés dans #{file}"
                File.write(file, new_content)
              else
                puts "• Aucun chemin à corriger dans #{file}"
              end
            end
          '

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git commit -m "Auto-fix image paths" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
