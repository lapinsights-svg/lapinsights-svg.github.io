name: Update Likes

on:
  repository_dispatch:
    types: [add-like]

jobs:
  update-likes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Update likes JSON
        run: |
          FILE="_data/likes.json"
          KEY="${{ github.event.client_payload.page }}"
          TMP=$(mktemp)

          # Lire la valeur actuelle
          CURRENT=$(jq -r --arg k "$KEY" '.[$k] // 0' "$FILE")

          # Incrémenter
          NEW=$((CURRENT + 1))

          # Mettre à jour
          jq --arg k "$KEY" --argjson v "$NEW" '.[$k] = $v' "$FILE" > "$TMP"
          mv "$TMP" "$FILE"

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add _data/likes.json
          git commit -m "Increment like for ${{ github.event.client_payload.page }}" || echo "No changes to commit"
          git push

    env:
      GITHUB_TOKEN: ${{ secrets.LIKE_TOKEN }}
