name: Convert Markdown images to <picture>

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  picture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert Markdown images to <picture> tags
        run: |
          find . -name "*.md" | while read file; do
            echo "Processing $file"

            # Étape 1 : marquer les images
            sed -i 's|!

\[|IMGALTSTART|g' "$file"
            sed -i 's|](images/|IMGSEP|g' "$file"

            # Étape 2 : reconstruire en <picture>
            sed -i 's|IMGALTSTART\([^]]*\)IMGSEP\([^)]*\)\.png)|<picture><source srcset="images/\2.webp" type="image/webp"><img src="images/\2.png" alt="\1"></picture>|g' "$file"
            sed -i 's|IMGALTSTART\([^]]*\)IMGSEP\([^)]*\)\.jpg)|<picture><source srcset="images/\2.webp" type="image/webp"><img src="images/\2.jpg" alt="\1"></picture>|g' "$file"
            sed -i 's|IMGALTSTART\([^]]*\)IMGSEP\([^)]*\)\.jpeg)|<picture><source srcset="images/\2.webp" type="image/webp"><img src="images/\2.jpeg" alt="\1"></picture>|g' "$file"

          done

      - name: Commit updated Markdown files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add *.md */*.md */*/*.md || true
          git commit -m "Convert Markdown images to <picture>" || echo "No changes"
          git push